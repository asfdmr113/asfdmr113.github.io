<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Photography Portfolio">
    <title>Photography - Portfolio</title>
    <script>
        // Early theme check to minimize FOUC
        if (localStorage.getItem('color-theme') === 'dark' ||
            (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap');
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .font-display {
            font-family: 'Playfair Display', serif;
        }
        /* Smooth fade-in for images as they load */
        
        img {
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        
        img.loaded {
            opacity: 1;
        }
        /* Gallery item transitions for filtering */
        
        .gallery-item {
            transition: opacity 0.3s ease-in-out;
            opacity: 1;
            display: block;
        }
        
        .gallery-item.filtered-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100 selection:bg-gray-200">

    <!-- Sticky minimalist nav -->
    <nav class="p-8 flex justify-between items-center sticky top-0 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md z-50">
        <a href="../index.html" class="text-xs md:text-sm font-medium hover:line-through transition-all uppercase tracking-widest">
            ← Back to Home
        </a>
        <h1 class="font-display text-lg md:text-xl font-semibold tracking-tight uppercase">
            Photography
        </h1>
        <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 transition-colors duration-300">
            <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414z"></path>
            </svg>
            <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-gray-600 dark:text-gray-200" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
            </svg>
        </button>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pb-20">
        <!-- Filter row -->
        <div class="flex flex-wrap gap-4 mb-10 md:mb-12 justify-center" id="filter-buttons">
            <button data-filter="all" class="filter-btn active-filter px-4 py-1 text-xs uppercase tracking-widest border border-black dark:border-white bg-black dark:bg-white text-white dark:text-black transition-all">
                All
            </button>
            <button data-filter="landscape" class="filter-btn px-4 py-1 text-xs uppercase tracking-widest border border-gray-200 dark:border-gray-700 hover:border-black dark:hover:border-white transition-all dark:text-gray-400">
                Landscapes
            </button>
            <button data-filter="urban" class="filter-btn px-4 py-1 text-xs uppercase tracking-widest border border-gray-200 dark:border-gray-700 hover:border-black dark:hover:border-white transition-all dark:text-gray-400">
                Urban
            </button>
            <button data-filter="nature" class="filter-btn px-4 py-1 text-xs uppercase tracking-widest border border-gray-200 dark:border-gray-700 hover:border-black dark:hover:border-white transition-all dark:text-gray-400">
                Nature
            </button>
        </div>

        <!-- Gallery grid -->
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="gallery">
            <!-- Card 1 - 4/5 -->
            <article class="gallery-item group relative overflow-hidden bg-gray-200 dark:bg-gray-800 aspect-[4/5] rounded-sm cursor-zoom-in lightbox-trigger" data-category="urban" data-full="../assets/images/photography/placeholder-1.webp">
                <img src="../assets/images/photography/placeholder-1.webp" alt="Placeholder frame for future Karawang street photograph" loading="lazy" onload="this.classList.add('loaded')" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                    <p class="text-white text-[10px] md:text-xs uppercase tracking-widest">
                        Karawang · Street Study
                    </p>
                </div>
            </article>

            <!-- Card 2 - square -->
            <article class="gallery-item group relative overflow-hidden bg-gray-200 dark:bg-gray-800 aspect-square rounded-sm cursor-zoom-in lightbox-trigger" data-category="nature" data-full="../assets/images/photography/placeholder-2.webp">
                <img src="../assets/images/photography/placeholder-2.webp" alt="Placeholder frame for future tropical foliage photograph" loading="lazy" onload="this.classList.add('loaded')" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                    <p class="text-white text-[10px] md:text-xs uppercase tracking-widest">
                        Tropical Garden · Details
                    </p>
                </div>
            </article>

            <!-- Card 3 - 4/5 -->
            <article class="gallery-item group relative overflow-hidden bg-gray-200 dark:bg-gray-800 aspect-[4/5] rounded-sm cursor-zoom-in lightbox-trigger" data-category="landscape" data-full="../assets/images/photography/placeholder-3.webp">
                <img src="../assets/images/photography/placeholder-3.webp" alt="Placeholder frame for future portrait photograph" loading="lazy" onload="this.classList.add('loaded')" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                    <p class="text-white text-[10px] md:text-xs uppercase tracking-widest">
                        Quiet Portrait · Indonesia
                    </p>
                </div>
            </article>

            <!-- Card 4 - square -->
            <article class="gallery-item group relative overflow-hidden bg-gray-200 dark:bg-gray-800 aspect-square rounded-sm cursor-zoom-in lightbox-trigger" data-category="urban" data-full="../assets/images/photography/placeholder-4.webp">
                <img src="../assets/images/photography/placeholder-4.webp" alt="Placeholder frame for future night city photograph" loading="lazy" onload="this.classList.add('loaded')" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                    <p class="text-white text-[10px] md:text-xs uppercase tracking-widest">
                        Neon Corners · After Rain
                    </p>
                </div>
            </article>

            <!-- Card 5 - square -->
            <article class="gallery-item group relative overflow-hidden bg-gray-200 dark:bg-gray-800 aspect-square rounded-sm cursor-zoom-in lightbox-trigger" data-category="nature" data-full="../assets/images/photography/placeholder-5.webp">
                <img src="../assets/images/photography/placeholder-5.webp" alt="Placeholder frame for future everyday detail photograph" loading="lazy" onload="this.classList.add('loaded')" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                    <p class="text-white text-[10px] md:text-xs uppercase tracking-widest">
                        Everyday Minimal · Textures
                    </p>
                </div>
            </article>

            <!-- Card 6 - 4/5 -->
            <article class="gallery-item group relative overflow-hidden bg-gray-200 dark:bg-gray-800 aspect-[4/5] rounded-sm cursor-zoom-in lightbox-trigger" data-category="urban" data-full="../assets/images/photography/placeholder-6.webp">
                <img src="../assets/images/photography/placeholder-6.webp" alt="Placeholder frame for future travel photograph" loading="lazy" onload="this.classList.add('loaded')" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                    <p class="text-white text-[10px] md:text-xs uppercase tracking-widest">
                        Transit Windows · In Motion
                    </p>
                </div>
            </article>
        </section>

        <!-- Lightbox -->
        <div id="lightbox" class="fixed inset-0 z-[100] bg-white/95 dark:bg-gray-900/95 backdrop-blur-sm hidden flex-col items-center justify-center p-4 md:p-10 transition-all duration-300">
            <button id="close-lightbox" class="absolute top-6 right-6 text-black dark:text-gray-200 hover:rotate-90 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <img id="lightbox-img" src="" alt="Expanded photograph" class="max-w-full max-h-[85vh] object-contain shadow-2xl">

            <p id="lightbox-caption" class="mt-6 text-[10px] uppercase tracking-[0.2em] text-gray-500 font-medium"></p>
        </div>
    </main>

    <footer class="text-center py-10 border-t border-gray-100 text-[10px] uppercase tracking-widest text-gray-400">
        &copy; 2026 · Captured in Indonesia
    </footer>
    <script src="../assets/js/main.js"></script>

</body>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const triggers = document.querySelectorAll('.lightbox-trigger');
        const closeBtn = document.getElementById('close-lightbox');

        if (!lightbox || !lightboxImg || !lightboxCaption || !closeBtn) return;

        triggers.forEach(trigger => {
            trigger.addEventListener('click', () => {
                const fullImgUrl = trigger.getAttribute('data-full');
                const img = trigger.querySelector('img');
                const altText = img ? img.getAttribute('alt') || '' : '';

                lightboxImg.src = fullImgUrl;
                lightboxCaption.textContent = altText;

                lightbox.classList.remove('hidden');
                lightbox.classList.add('flex');
                document.body.style.overflow = 'hidden'; // Stop scrolling background
            });
        });

        const close = () => {
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
            document.body.style.overflow = 'auto'; // Re-enable scrolling
        };

        closeBtn.addEventListener('click', close);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) close(); // Close when clicking outside image
        });
    });

    // Gallery Filter Logic
    document.addEventListener('DOMContentLoaded', () => {
        const filterButtons = document.querySelectorAll('.filter-btn');
        const galleryItems = document.querySelectorAll('.gallery-item');

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                const filter = button.getAttribute('data-filter');

                // Update active button styles
                filterButtons.forEach(btn => {
                    btn.classList.remove('active-filter', 'bg-black', 'text-white', 'dark:bg-white', 'dark:text-black', 'border-black', 'dark:border-white');
                    btn.classList.add('border-gray-200', 'dark:border-gray-700', 'dark:text-gray-400');
                });

                // Set active button styles
                button.classList.add('active-filter', 'bg-black', 'text-white', 'dark:bg-white', 'dark:text-black', 'border-black', 'dark:border-white');
                button.classList.remove('border-gray-200', 'dark:border-gray-700', 'dark:text-gray-400');

                // Filter items with smooth transitions
                galleryItems.forEach(item => {
                    const category = item.getAttribute('data-category');
                    const shouldShow = filter === 'all' || category === filter;

                    if (shouldShow) {
                        // Show item: ensure it's displayed, then fade in
                        item.style.display = 'block';
                        // Remove filtered-out class after a tiny delay to trigger fade-in
                        requestAnimationFrame(() => {
                            item.classList.remove('filtered-out');
                        });
                    } else {
                        // Hide item: fade out first, then hide to keep grid balanced
                        item.classList.add('filtered-out');
                        // Hide after transition completes (300ms)
                        setTimeout(() => {
                            if (item.classList.contains('filtered-out')) {
                                item.style.display = 'none';
                            }
                        }, 300);
                    }
                });
            });
        });
    });
</script>

</html>
