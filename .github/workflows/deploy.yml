name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger on every push to main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . # Deploy the root folder (since this is a static HTML site)
          branch: gh-pages # The branch the site will be served from
